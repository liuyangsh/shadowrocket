mitm:
  hostnames:
    - "*.camscanner.com"
    - "*.intsig.net"

scripts:
- name: CamScanner
  type: http-response
  pattern: "^https:\/\/.*\.(intsig\.net|camscanner\.com)"
  requires-body: true
  max-size: -1
  script-path: https://raw.githubusercontent.com/chxm1023/Rewrite/main/CamScanner.js

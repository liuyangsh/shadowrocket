name: CamScanner 解锁
desc: 扫描全能王解锁
author: 自用

mitm:
  hostnames:
    includes:
      - "*.camscanner.com"
      - "*.intsig.net"

scriptings:
  - http_response:
      name: CamScanner
      match: "^https://.*\\.(intsig\\.net|camscanner\\.com)"
      script_url: https://raw.githubusercontent.com/chxm1023/Rewrite/main/CamScanner.js
      body_required: true
      max_size: -1
